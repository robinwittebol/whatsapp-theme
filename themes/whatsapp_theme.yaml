# WhatsApp Theme for Home Assistant
# By Robin Wittebol
# 
# Version 1.3.0
# 
# Supports light and dark mode
# https://github.com/robinwittebol/whatsapp-theme

whatsapp_theme:

  # Color pallette
  ha-color-primary-05: '#00130F'
  ha-color-primary-10: '#00261F'
  ha-color-primary-20: '#004D3E'
  ha-color-primary-30: '#00735D'
  ha-color-primary-40: '#00A884'
  ha-color-primary-50: '#26B894'
  ha-color-primary-60: '#52C8A5'
  ha-color-primary-70: '#7FD8B6'
  ha-color-primary-80: '#B3E9D4'
  ha-color-primary-90: '#D9F5E8'
  ha-color-primary-95: '#ECFAF3'

  # ha-color-primary-40: var(--wapp-primary)

  # General Colors Light
  wapp-teal: var(--wapp-primary)
  wapp-green: var(--wapp-primary)
  wapp-green-rgb: 0, 168, 132;
  wapp-blue: '#0F51AB'
  wapp-pink: '#ff2e74'
  wapp-purple: '#7f66ff'
  wapp-orange: '#bf8924'
  wapp-red: '#a80000'
  wapp-yellow: '#edd31d'
  wapp-cyan: '#2efbff'
  wapp-gray: '#a0a4a5'
  wapp-black: '#00110d'

  # General Colors Dark
  wapp-teal-dark: var(--wapp-primary-dark)
  wapp-green-dark: var(--wapp-primary-dark)
  wapp-green-dark-rgb: 0, 168, 132;
  wapp-blue-dark: var(--wapp-blue)
  wapp-pink-dark: var(--wapp-pink)
  wapp-purple-dark: var(--wapp-purple)
  wapp-orange-dark: var(--wapp-orange)
  # wapp-red-dark: var(--wapp-red)
  wapp-red-dark: '#b61313'
  wapp-yellow-dark: var(--wapp-yellow)
  wapp-cyan-dark: var(--wapp-cyan)
  # wapp-gray-dark: '#1a2429'
  wapp-gray-dark: var(--wapp-gray)
  wapp-black-dark: var(--wapp-black)

  # UI Colors Light
  wapp-bg: '#f0f2f5'
  wapp-bg-2: '#f7f8fa'
  wapp-header: '#008069'
  wapp-convo-bg: '#c9c3bb'
  wapp-modal-bg: '#fff'
  wapp-primary: '#00a884'
  wapp-primary-2: '#115c4d'
  wapp-text-old: '#121b20'
  wapp-text: '#32342f'
  wapp-text-2: '#707f86'
  wapp-badge-bg: '#c3c7c9'
  wapp-bubble-bg: '#e6ffdb'
  wapp-divider: '#f1f4f5'

  # UI Colors Dark
  wapp-bg-dark: '#121b22'
  wapp-header-dark: '#1f2c34'
  wapp-convo-bg-dark: '#09141a'
  wapp-modal-bg-dark : '#2a3b45'
  wapp-primary-dark: '#00a884'
  wapp-primary-dark-2: '#0c463f'
  wapp-text-dark: '#d7dee4'
  wapp-text-dark-2: '#83949f'
  wapp-badge-bg-dark: '#192528'
  wapp-bubble-bg-dark: '#005d4b'
  wapp-divider-dark: '#2b373e'

  # Common
  # Header
  # header-height: '60px'
  header-height: '56px'

  # Main UI
  # masonry-view-card-margin: '4px 16px 8px'
  # masonry-view-card-margin: '16px 8px'
  # grid-card-gap: '16px'
  # stack-card-gap: '16px'
  # ha-section-grid-row-gap: '16px'
  # ha-section-grid-column-gap: '16px'

  # Badges
  ha-label-badge-border-radius: '16px'
  ha-label-badge-color: var(--primary-color)

  # Errors/warnings
  error-color: var(--red-color)
  warning-color: var(--orange-color)
  success-color: var(--green-color)
  info-color: var(--green-color)

  # Text
  # paper-font-headline_-_font-size: '16px'

  # Sidebar
  sidebar-selected-background-color: var(--primary-background-color)
  sidebar-icon-color: var(--secondary-text-color)
  sidebar-text-color: var(--primary-text-color)
  sidebar-selected-icon-color: var(--primary-color)
  sidebar-selected-text-color: var(--sidebar-selected-icon-color)

  # Buttons
  mdc-theme-on-primary: '#fff'
  mdc-button-outline-color: 'rgba(0, 168, 132, .3)'

  # Cards
  ha-card-border-radius: '8px'
  ha-card-border-width: '0'
  ha-card-border-color: 'transparent'
  ha-card-header-font-size: '16px'

  # Inputs
  # paper-input-container-color: var(--secondary-text-color)
  # paper-input-container-focus-color: var(--primary-color)
  # paper-input-container-underline-focus_-_border-color: var(--primary-color)
  # paper-input-container-underline_-_border-color: var(--secondary-text-color)

  # Checkboxes/radio buttons
  mdc-checkbox-unchecked-color: var(--secondary-text-color)
  mdc-radio-unchecked-color: var(--secondary-text-color)

  # Sliders
  # paper-slider-knob-color: var(--primary-color)
  # paper-slider-knob-start-color: var(--paper-slider-knob-color)
  # paper-slider-pin-color: var(--paper-slider-knob-color)
  # paper-slider-active-color: var(--paper-slider-knob-color)
  # paper-slider-secondary-color: var(--light-primary-color)
  control-circular-slider-color: var(--primary-color)
  
  # Select
  control-select-border-radius: var(--ha-card-border-radius)
  control-select-button-border-radius: var(--ha-card-border-radius)
  control-select-menu-border-radius: var(--ha-card-border-radius)
  # control-select-menu-background-color: var(ha-card-background)
  # control-select-menu-background-opacity: '1' 
  
  # States
  state-active-color: var(--primary-color)
  state-on-color: var(--wapp-teal)
  state-off-color: var(--wapp-red)
  state-home-color: var(--wapp-teal)
  state-not_home-color: var(--wapp-red)
  state-unknown-color: var(--wapp-gray)
  state-idle-color: var(--wapp-gray)
  state-climate-cool-color: var(--primary-color)
  state-climate-heat-color: var(--primary-color)
  state-climate-heat-cool-color: var(--primary-color)
  state-climate-dry-color: var(--primary-color)
  state-climate-fan_only-color: var(--primary-color)
  state-humidifier-on-color: var(--primary-color)
  state-dehumidifier-on-color: var(--primary-color)
  state-fan-on-color: var(--primary-color)
  state-binary_sensor-on-color: var(--primary-color)
  state-switch-on-color: var(--primary-color)
  state-cover-open-color: var(--primary-color)

  # Modals
  ha-dialog-border-radius: '10px'

  # Expansion panels
  expansion-panel-summary-padding: '0 16px'
  expansion-panel-content-padding: '0 16px'

  # Tables
  table-row-background-color: var(--primary-background-color)
  table-row-alternative-background-color: var(--secondary-background-color)
  data-table-background-color: var(--primary-background-color)

  # Energy
  energy-grid-consumption-color: var(--wapp-bubble-bg)
  energy-grid-return-color: var(--green-color)
  energy-solar-color: var(--yellow-color)
  energy-non-fossil-color: var(--green-color)
  energy-battery-out-color: var(--primary-text-color)
  energy-battery-in-color: var(--primary-text-color)
  energy-gas-color: var(--red-color)
  energy-water-color: var(--cyan-color)

  # Ripple
  mdc-ripple-color: var(--primary-color)

  # Custom cards
  # Mini graph card
  mcg-title-font-weight: '16px'

  # Mini media player card
  mini-media-player-accent-color: var(--text-primary-color)
  mini-media-player-icon-color: var(--text-primary-color)

  # Sun card
  sun-card-text-color: var(--primary-text-color);
  sun-card-subtitle-color: var(--secondary-text-color);

  modes:
    # -----------------------------------------------------------
    # Dark mode
    # -----------------------------------------------------------
    dark:
      # Background
      lovelace-background: var(--wapp-bg-dark)

      # Header:
      app-header-background-color: var(--wapp-header-dark)
      app-header-text-color: var(--wapp-text-dark)
      app-header-border-bottom: 1px solid var(--divider-color)
      app-header-edit-background-color: var(--wapp-header-dark)
      app-header-edit-text-color: var(--wapp-text-dark)
      app-header-selection-bar-color: var(--primary-color)
      app-header-selection-text-color: var(--primary-color)

      # Main UI
      primary-color: var(--wapp-primary-dark)
      light-primary-color: var(--primary-color)
      primary-background-color: var(--wapp-bg-dark)
      secondary-background-color: var(--wapp-bg-dark)
      divider-color: rgba(255,255,255,.08)
      accent-color: var(--wapp-primary-dark)
      mdc-theme-primary: var(--wapp-primary-dark)

      # Replace default colors
      teal-color: var(--wapp-teal-dark)
      green-color: var(--wapp-green-dark)
      blue-color: var(--wapp-blue-dark) 
      pink-color: var(--wapp-pink-dark) 
      purple-color: var(--wapp-purple-dark) 
      orange-color: var(--wapp-orange-dark) 
      red-color: var(--wapp-red-dark) 
      yellow-color: var(--wapp-yellow-dark) 
      cyan-color: var(--wapp-cyan-dark) 
      gray-color: var(--wapp-gray-dark) 
      black-color: var(--wapp-black-dark) 

      # Text
      primary-text-color: var(--wapp-text-dark)
      secondary-text-color: var(--wapp-text-dark-2)
      text-primary-color: '#fff'
      disabled-text-color: var(--wapp-text-dark-2)
      mdc-theme-on-secondary: '#fff'

      # Sidebar
      sidebar-background-color: var(--wapp-header-dark)

      # Buttons
      # paper-item-icon-color: var(--wapp-text-dark-2)
      # paper-item-icon-active-color: var(--wapp-primary-dark)

      # Labels
      label-badge-background-color: var(--wapp-gray-dark)
      label-badge-text-color: var(--wapp-text-dark)
      label-badge-red: var(--wapp-red-dark)
      label-badge-green: var(--wapp-teal-dark)
      label-badge-blue: var(--wapp-blue-dark)
      label-badge-yellow: var(--wapp-yellow-dark)
      label-badge-gray: var(--wapp-gray-dark)

      # Cards
      ha-heading-card-title-color: var(--wapp-text-2)
      card-background-color: var(--wapp-header-dark)
      ha-card-background: var(--wapp-header-dark)
      ha-card-box-shadow: '0 1px 1.5px rgba(11, 20, 26, .76)'
      # paper-dialog-background-color: var(--card-background-color)
      # paper-card-background-color: var(--card-background-color)
      ha-card-header-color: var(--wapp-text-dark-2)

      # Switches
      switch-checked-button-color: var(--wapp-primary-dark)
      switch-checked-track-color: var(--wapp-primary-dark)
      switch-unchecked-button-color: rgb(172, 176, 185)
      switch-unchecked-track-color: rgb(154, 160, 166)

      # Toggles
      # paper-toggle-button-checked-button-color: var(--switch-checked-button-color)
      # paper-toggle-button-checked-bar-color: var(--switch-checked-track-color)
      # paper-toggle-button-unchecked-button-color: var(--switch-unchecked-button-color)
      # paper-toggle-button-unchecked-bar-color: var(--switch-unchecked-track-color)

      # Dropdowns
      material-background-color: var(--wapp-modal-bg-dark)
      material-secondary-background-color: var(--primary-background-color)
      mdc-theme-surface: var(--wapp-modal-bg-dark)
      # paper-listbox-background-color: var(--wapp-modal-bg-dark)

      # Code editor
      markdown-code-background-color: var(--wapp-bg-dark)

      # Checkboxes
      mdc-select-ink-color: var(--primary-text-color)
      mdc-select-label-ink-color: var(--secondary-text-color)
      mdc-select-idle-line-color: var(--primary-text-color)
      mdc-select-dropdown-icon-color: var(--secondary-text-color)
      mdc-select-hover-line-color: var(--accent-color)

      # Inputs
      input-dropdown-icon-color: var(--secondary-text-color)
      input-ink-color: var(--primary-text-color)
      input-label-ink-color: var(--secondary-text-color)
      input-idle-line-color: var(--primary-text-color)
      input-hover-line-color: var(--accent-color)

      # Modals
      mdc-dialog-scrim-color: 'rgba(0, 0, 0, 0.5)'

      # Ripple
      # paper-tab-ink: var(--wapp-primary-dark-2)

      # Chips
      ha-chip-background-color: var(--wapp-badge-bg-dark)
      ha-chip-text-color: var(--primary-text-color)

      # States
      state-icon-color: var(--wapp-text-dark)
      state-icon-active-color: var(--wapp-primary-dark)
      state-icon-unavailable-color: var(--disabled-text-color)

      # Graphs
      graph-color-1: var(--wapp-teal-dark)
      graph-color-2: var(--wapp-blue-dark)
      graph-color-3: var(--wapp-yellow-dark)
      graph-color-4: var(--wapp-red-dark)
      graph-color-5: var(--wapp-purple-dark)
      graph-color-6: var(--wapp-pink-dark)
      graph-color-7: var(--wapp-orange-dark)
      graph-color-8: var(--wapp-cyan-dark)
      graph-color-9: var(--wapp-green-dark)

      # Toasts
      # paper-toast-background-color: var(--wapp-modal-bg-dark)
      # paper-toast-color: var(--primary-text-color)

      # Progressbar
      mdc-linear-progress-buffer-color: 'rgba(0,0,0,0.4)'

    # -----------------------------------------------------------
    # Light mode
    # -----------------------------------------------------------
    light:
      # Background
      lovelace-background: var(--wapp-bg)

      # Header:
      app-header-background-color: var(--wapp-header)
      app-header-text-color: '#fff'
      app-header-border-bottom: 1px solid var(--wapp-bg)
      app-header-edit-background-color: var(--wapp-primary-2)
      app-header-edit-text-color: var(--wapp-text-dark)
      # app-header-selection-bar-color: var(--primary-color)
      # app-header-selection-text-color: var(--primary-color)

      # Main UI
      primary-color: var(--wapp-primary)
      light-primary-color: var(--wapp-bubble-bg)
      primary-background-color: var(--wapp-bg)
      secondary-background-color: var(--wapp-bg)
      divider-color: 'rgba(0, 0, 0, .08)'
      accent-color: var(--wapp-primary)
      mdc-theme-primary: var(--wapp-primary)

      # Replace default colors
      teal-color: var(--wapp-teal)
      green-color: var(--wapp-green)
      blue-color: var(--wapp-blue) 
      pink-color: var(--wapp-pink) 
      purple-color: var(--wapp-purple) 
      orange-color: var(--wapp-orange) 
      red-color: var(--wapp-red) 
      yellow-color: var(--wapp-yellow) 
      cyan-color: var(--wapp-cyan) 
      gray-color: var(--wapp-gray) 
      black-color: var(--wapp-black) 

      # Text
      primary-text-color: var(--wapp-text)
      secondary-text-color: var(--wapp-text-2)
      text-primary-color: '#fff'
      disabled-text-color: var(--secondary-text-color)
      mdc-theme-on-secondary: '#fff'

      # Sidebar
      sidebar-background-color: '#fff'

      # Buttons
      # paper-item-icon-color: var(--wapp-text-2)
      # paper-item-icon-active-color: var(--wapp-primary)

      # Labels
      label-badge-background-color: var(--wapp-gray)
      label-badge-text-color: var(--wapp-text-dark)
      label-badge-red: var(--wapp-red)
      label-badge-green: var(--wapp-teal)
      label-badge-blue: var(--wapp-blue)
      label-badge-yellow: var(--wapp-yellow)
      label-badge-gray: var(--wapp-gray)

      # Cards
      ha-heading-card-title-color: var(--wapp-text-2)
      card-background-color: '#fff'
      ha-card-background: '#fff'
      ha-card-box-shadow: '0 1px 1.5px rgba(11, 20, 26, .16)'
      # paper-dialog-background-color: var(--card-background-color)
      # paper-card-background-color: var(--card-background-color)
      ha-card-header-color: var(--wapp-text-2)

      # Switches
      switch-checked-button-color: var(--wapp-primary)
      switch-checked-track-color: var(--wapp-primary-2)
      switch-unchecked-button-color: rgb(172, 176, 185)
      switch-unchecked-track-color: rgb(154, 160, 166)

      # Toggles
      # paper-toggle-button-checked-button-color: var(--switch-checked-button-color)
      # paper-toggle-button-checked-bar-color: var(--switch-checked-track-color)
      # paper-toggle-button-unchecked-button-color: var(--switch-unchecked-button-color)
      # paper-toggle-button-unchecked-bar-color: var(--switch-unchecked-track-color)

      # Dropdowns
      material-background-color: var(--wapp-modal-bg)
      material-secondary-background-color: var(--primary-background-color)
      mdc-theme-surface: var(--wapp-modal-bg)
      # paper-listbox-background-color: var(--wapp-modal-bg)

      # Code editor
      markdown-code-background-color: var(--wapp-bg)

      # Checkboxes
      mdc-select-ink-color: var(--primary-text-color)
      mdc-select-label-ink-color: var(--secondary-text-color)
      mdc-select-idle-line-color: var(--primary-text-color)
      mdc-select-dropdown-icon-color: var(--secondary-text-color)
      mdc-select-hover-line-color: var(--accent-color)

      # Inputs
      input-dropdown-icon-color: var(--secondary-text-color)
      input-ink-color: var(--primary-text-color)
      input-label-ink-color: var(--secondary-text-color)
      input-idle-line-color: var(--primary-text-color)
      input-hover-line-color: var(--accent-color)

      # Modals
      mdc-dialog-scrim-color: 'rgba(0, 0, 0, 0.5)'

      # Ripple
      # paper-tab-ink: var(--wapp-primary-2)

      # Chips
      ha-chip-background-color: var(--wapp-badge-bg)
      ha-chip-text-color: var(--primary-text-color)

      # States
      state-icon-color: var(--wapp-text)
      state-icon-active-color: var(--wapp-header)
      state-icon-unavailable-color: var(--disabled-text-color)

      # Graphs
      graph-color-1: var(--wapp-teal)
      graph-color-2: var(--wapp-blue)
      graph-color-3: var(--wapp-yellow)
      graph-color-4: var(--wapp-red)
      graph-color-5: var(--wapp-purple)
      graph-color-6: var(--wapp-pink)
      graph-color-7: var(--wapp-orange)
      graph-color-8: var(--wapp-cyan)
      graph-color-9: var(--wapp-green)

      # Toasts
      # paper-toast-background-color: var(--wapp-modal-bg)
      # paper-toast-color: var(--primary-text-color)

      # Progressbar
      mdc-linear-progress-buffer-color: 'rgba(0,0,0,0.2)'

      # Tables
      data-table-background-color: var(--wapp-bg-2)
